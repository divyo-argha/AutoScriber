<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>autoScriber — AI-Powered Bangla Transcription</title>
  <meta name="description" content="autoScriber transcribes Bangla audio with speaker diarization, word-level timestamps, and rich export formats. Free desktop app for macOS, Windows, and Linux." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="components/nav/nav.module.css" />
  <link rel="stylesheet" href="components/hero/hero.module.css" />
  <link rel="stylesheet" href="components/features/features.module.css" />
  <link rel="stylesheet" href="components/models/models.module.css" />
  <link rel="stylesheet" href="components/pipeline/pipeline.module.css" />
  <link rel="stylesheet" href="components/download/download.module.css" />
  <link rel="stylesheet" href="components/about/about.module.css" />
  <link rel="stylesheet" href="components/footer/footer.module.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (systemDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <div data-component="nav"></div>

  <main>
    <div data-component="hero"></div>
    <div data-component="features"></div>
    <div data-component="models"></div>
    <div data-component="pipeline"></div>
    <div data-component="download"></div>
    <div data-component="about"></div>
  </main>

  <div data-component="footer"></div>

  <noscript>
    <p class="noscript">autoScriber needs JavaScript to render this page. Please enable JavaScript in your browser.</p>
  </noscript>

  <script src="js/main.js"></script>
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="components/nav/nav.js"></script>
  <script type="module" src="components/download/download.js"></script>
</body>
</html>
